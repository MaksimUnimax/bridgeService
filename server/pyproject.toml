[build-system]
requires = ["setuptools>=65", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "business-bridge-2-direct"
version = "0.9.0"
description = "Business Bridge 2 Direct protected task/report API service"
requires-python = ">=3.10,<3.11"
dependencies = ["cryptography==43.0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["business_bridge_direct*"]
namespaces = false

[tool.setuptools.package-data]
business_bridge_direct = ["py.typed"]
